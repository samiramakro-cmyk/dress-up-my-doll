/* ============================================================
   DRAW OUTFIT THUMBNAIL
============================================================ */

async function createOutfitThumbnail() {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        240;

    canvas.height =
        300;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        Background
    */

    if (currentBackground) {

        const background =
            assets.find(
                asset =>
                    asset.id ===
                    currentBackground
            );


        if (background) {

            try {

                const image =
                    await loadImageFromURL(
                        background.dataURL
                    );


                ctx.drawImage(
                    image,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

            } catch (error) {

                console.warn(
                    error
                );

            }

        }

    }


    /*
        Draw stage items in z order.
    */

    const sorted =
        gameItems
            .filter(
                item =>
                    !item.hidden
            )
            .slice()
            .sort(
                (a, b) =>
                    a.z - b.z
            );


    for (
        const item of sorted
    ) {

        const asset =
            assets.find(
                asset =>
                    asset.id ===
                    item.assetId
            );


        if (!asset) {

            continue;

        }


        try {

            const image =
                await loadImageFromURL(
                    asset.dataURL
                );


            const width =
                canvas.width *
                (
                    item.width /
                    100
                );


            const height =
                width *
                (
                    asset.height /
                    asset.width
                );


            const x =
                canvas.width *
                (
                    item.x /
                    100
                );

            const y =
                canvas.height *
                (
                    item.y /
                    100
                );


            ctx.save();

            ctx.translate(
                x,
                y
            );

            ctx.rotate(
                item.rotation *
                Math.PI /
                180
            );

            ctx.scale(
                item.scaleX,
                item.scaleY
            );


            ctx.drawImage(
                image,
                -width / 2,
                -height / 2,
                width,
                height
            );


            ctx.restore();

        } catch (error) {

            console.warn(
                "Thumbnail error:",
                error
            );

        }

    }


    return canvas.toDataURL(
        "image/jpeg",
        0.82
    );

}


/* ============================================================
   SAVE OUTFIT
============================================================ */

async function saveCurrentOutfit() {

    const name =
        prompt(
            "Name this outfit:",
            "My Outfit " +
            (
                getSavedOutfits()
                    .length + 1
            )
        );


    if (
        !name ||
        !name.trim()
    ) {

        return;

    }


    updateStorageStatus(
        "Saving outfit...",
        "saving"
    );


    try {

        const thumbnail =
            await createOutfitThumbnail();


        const outfit = {

            id:
                makeId("outfit"),

            name:
                name.trim(),

            createdAt:
                Date.now(),

            thumbnail,

            data:
                getStageExportData()

        };


        const outfits =
            getSavedOutfits();


        outfits.unshift(
            outfit
        );


        /*
            Keep the saved-outfit list reasonable.
        */

        if (
            outfits.length >
            30
        ) {

            outfits.length =
                30;

        }


        const success =
            saveSavedOutfits(
                outfits
            );


        if (!success) {

            throw new Error(
                "Could not save outfit."
            );

        }


        updateStorageStatus(
            "Saved",
            "saved"
        );


        showToast(
            "Outfit saved.",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        updateStorageStatus(
            "Save failed",
            "error"
        );


        showToast(
            "Could not save the outfit. Browser storage may be full.",
            "error"
        );

    }

}

    outfit
) {

    if (!outfit || !outfit.data) {

        return;

    }


    pushHistory();


    gameItems =
        JSON.parse(
            JSON.stringify(
                outfit.data.gameItems ||
                []
            )
        );


    currentBackground =
        outfit.data.currentBackground ||
        null;


    zCounter =
        outfit.data.zCounter ||
        10;


    selectedItemId =
        null;


    renderStage();

    scheduleAutosave();

    closeModal(
        "savedModal"
    );


    showToast(
        "Outfit loaded.",
        "success"
    );

}


function deleteSavedOutfit(
    id
) {

    const confirmed =
        confirm(
            "Delete this saved outfit?"
        );


    if (!confirmed) {

        return;

    }


    const outfits =
        getSavedOutfits()
            .filter(
                outfit =>
                    outfit.id !==
                    id
            );


    saveSavedOutfits(
        outfits
    );


    renderSavedOutfits();


    showToast(
        "Saved outfit deleted."
    );

}

/* ============================================================
   RESTORE AUTOSAVE
============================================================ */

function getAutosave() {

    const raw =
        safeLocalGet(
            AUTOSAVE_KEY
        );


    if (!raw) {

        return null;

    }


    try {

        return JSON.parse(
            raw
        );

    } catch (error) {

        return null;

    }

function restoreAutosaveIfAvailable() {

    const data =
        getAutosave();


    if (
        !data ||
        !Array.isArray(
            data.gameItems
        )
    ) {

        return;

    }


    /*
        Don't automatically restore an empty session.
    */

    if (
        data.gameItems.length ===
        0 &&
        !data.currentBackground
    ) {

        return;

    }


    const savedDate =
        data.savedAt
            ? new Date(
                data.savedAt
            ).toLocaleString()
            : "";


    const restore =
        confirm(
            "A previous session was automatically saved" +
            (
                savedDate
                    ? "\n\nSaved: " +
                      savedDate
                    : ""
            ) +
            "\n\nRestore it?"
        );


    if (!restore) {

        return;

    }


    gameItems =
        JSON.parse(
            JSON.stringify(
                data.gameItems
            )
        );


    selectedItemId =
        data.selectedItemId ||
        null;


    currentBackground =
        data.currentBackground ||
        null;


    zCounter =
        data.zCounter ||
        10;


    renderStage();


    updateStorageStatus(
        "Session restored",
        "saved"
    );


    showToast(
        "Previous session restored.",
        "success"
    );

}

/* ============================================================
   KEYBOARD SHORTCUTS
============================================================ */

document.addEventListener(
    "keydown",
    function(event) {

        /*
            Don't intercept typing in inputs.
        */

        const tag =
            document.activeElement
                ?.tagName
                ?.toLowerCase();


        if (
            tag === "input" ||
            tag === "textarea" ||
            tag === "select"
        ) {

            return;

        }


        /*
            Delete
        */

        if (
            event.key ===
            "Delete"
        ) {

            event.preventDefault();

            deleteSelected();

        }


        /*
            Ctrl/Cmd + Z
        */

        if (
            (event.ctrlKey ||
                event.metaKey) &&
            !event.shiftKey &&
            event.key.toLowerCase() ===
                "z"
        ) {

            event.preventDefault();

            undo();

        }


        /*
            Ctrl/Cmd + Shift + Z
        */

        if (
            (event.ctrlKey ||
                event.metaKey) &&
            event.shiftKey &&
            event.key.toLowerCase() ===
                "z"
        ) {

            event.preventDefault();

            redo();

        }


        /*
            Ctrl/Cmd + D
        */

        if (
            (event.ctrlKey ||
                event.metaKey) &&
            event.key.toLowerCase() ===
                "d"
        ) {

            event.preventDefault();

            duplicateSelected();

        }


        /*
            Arrow keys move selected item.
        */

        const item =
            getSelectedItem();


        if (
            item &&
            !item.locked
        ) {

            let moved =
                false;


            if (
                event.key ===
                "ArrowLeft"
            ) {

                pushHistory();

                item.x -=
                    event.shiftKey
                        ? 2
                        : .5;

                moved =
                    true;

            }


            if (
                event.key ===
                "ArrowRight"
            ) {

                pushHistory();

                item.x +=
                    event.shiftKey
                        ? 2
                        : .5;

                moved =
                    true;

            }


            if (
                event.key ===
                "ArrowUp"
            ) {

                pushHistory();

                item.y -=
                    event.shiftKey
                        ? 2
                        : .5;

                moved =
                    true;

            }


            if (
                event.key ===
                "ArrowDown"
            ) {

                pushHistory();

                item.y +=
                    event.shiftKey
                        ? 2
                        : .5;

                moved =
                    true;

            }


            if (moved) {

                event.preventDefault();

                clampItem(
                    item
                );

                renderStage();

                scheduleAutosave();

            }

        }

    }
);

    )
    .addEventListener(
        "click",
        saveCurrentOutfit
    );


document
    .getElementById(
        "loadOutfitBtn"
    )
    .addEventListener(
        "click",
        openSavedOutfits
    );


/* ============================================================
   CLOSET EVENTS
============================================================ */

document
    .getElementById(
        "closetSearch"
    )
    .addEventListener(
        "input",
        renderCloset
    );


document
    .getElementById(
        "closetSort"
    )
    .addEventListener(
        "change",
        renderCloset
    );


document
    .getElementById(
        "favoriteFilterBtn"
    )
    .addEventListener(
        "click",
        function() {

            favoriteFilter =
                !favoriteFilter;


            this.classList.toggle(
                "active",
                favoriteFilter
            );


            renderCloset();

        }
    );


/* ============================================================
   MODAL CLOSE BUTTONS
============================================================ */

document
    .querySelectorAll(
        "[data-close]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    closeModal(
                        this.dataset.close
                    );

                }
            );

        }
    );


/*
    Clicking outside a modal closes it.
*/

document
    .querySelectorAll(
        ".modal-overlay"
    )
    .forEach(
        overlay => {

            overlay.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        overlay
                    ) {

                        overlay.classList.remove(
                            "open"
                        );

                    }

                }
            );

        }
    );


/* ============================================================
   WINDOW BEFORE UNLOAD
============================================================ */

window.addEventListener(
    "beforeunload",
    function() {

        /*
            Save immediately instead of waiting
            for the debounce timer.
        */

        clearTimeout(
            autosaveTimer
        );


        performAutosave();

    }
);


/* ============================================================
   INITIALIZE
============================================================ */

async function initialize() {

    try {

        updateStorageStatus(
            "Starting...",
            "saving"
        );


        await initializeStorage();


        /*
            Load existing wardrobe assets.
        */

        try {

            assets =
                await getAllAssetsFromDB();

        } catch (error) {

            console.error(
                "Could not load assets:",
                error
            );


            /*
                If IndexedDB suddenly becomes
                unavailable, try localStorage.
            */

            if (
                storageMode ===
                "indexedDB"
            ) {

                const fallback =
                    getFallbackAssets();


                if (
                    fallback.length > 0
                ) {

                    assets =
                        fallback;

                    storageMode =
                        "localStorage";

                } else {

                    assets =
                        [];

                }

            } else {

                assets =
                    [];

            }

        }


        renderCategories();

        renderStage();


        /*
            Restore previous session.
        */

        setTimeout(
            restoreAutosaveIfAvailable,
            300
        );


        updateStageZoom(
            100
        );


        if (
            storageMode ===
            "indexedDB"
        ) {

            updateStorageStatus(
                "Storage: IndexedDB",
                "saved"
            );

        } else if (
            storageMode ===
            "localStorage"
        ) {

            updateStorageStatus(
                "Storage: local",
                "saved"
            );

        } else {

            updateStorageStatus(
                "Storage: temporary",
                "error"
            );

        }


    } catch (error) {

        console.error(
            "Initialization error:",
            error
        );


        /*
            Important:
            The application should still open even
            if browser storage fails.
        */

        assets =
            [];

        gameItems =
            [];

        renderCategories();

        renderStage();


        updateStorageStatus(
            "Storage unavailable",
            "error"
        );


        showToast(
            "The app opened, but browser storage is unavailable. Try localhost or your website for persistent storage.",
            "error"
        );

    }

}


/*
    Start the application.
*/

initialize();

// Deselect object when clicking outside the stage
document.addEventListener("click", function(e) {
    const stage = document.querySelector(".stage");

    if (stage && !stage.contains(e.target)) {
        selectedItemId = null;
        renderStage();
    }
});

</script>
